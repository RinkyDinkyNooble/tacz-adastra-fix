modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_url}"
logoFile="${mod_id}.png"
logoBlur=true
authors="${mod_authors}"
credits="Ad Astra is made by Terrarium (Alex Nijjar and contributors). TaCZ is made by the TaCZ team. This patch only changes how first-person arms look with an Ad Astra suit on."
# Client-only and does nothing on a server, so a client and server don't have to match.
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ad_astra"
    mandatory=true
    versionRange="${ad_astra_version_range}"
    ordering="AFTER"
    side="CLIENT"
