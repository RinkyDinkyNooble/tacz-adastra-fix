// Settings both loaders share. Each one's own setup is in neoforge/build.gradle and fabric/build.gradle.
subprojects {
    apply plugin: 'java'

    version = mod_version
    group = mod_group_id

    base {
        archivesName = "${mod_id}-${project.name}-${minecraft_version}"
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    // The fix is the same on both loaders, so each one compiles common/ alongside its own entry point.
    sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

    tasks.named('processResources', ProcessResources).configure {
        var replaceProperties = [
                minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                fabric_minecraft_range: fabric_minecraft_range,
                neoforge_version_range: neoforge_version_range,
                fabric_loader_range: fabric_loader_range,
                ad_astra_version_range: ad_astra_version_range, fabric_ad_astra_range: fabric_ad_astra_range,
                mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
                mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
                mod_url: mod_url, mod_issues: mod_issues,
        ]
        inputs.properties replaceProperties
        filesMatching(['META-INF/neoforge.mods.toml', 'fabric.mod.json']) {
            expand replaceProperties + [project: project]
        }
    }

    tasks.named('jar', Jar).configure {
        manifest {
            attributes([
                    'Specification-Title'   : mod_id,
                    'Specification-Vendor'  : mod_authors,
                    'Specification-Version' : '1',
                    'Implementation-Title'  : project.name,
                    'Implementation-Version': project.version,
                    'Implementation-Vendor' : mod_authors,
            ])
        }
        // Ship the license inside the jar too.
        from(rootProject.file('LICENSE')) {
            rename { "LICENSE_${mod_id}" }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
